<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .hero { position:relative; border-radius:4px; overflow:hidden; height:260px; background-image:url(../assets/placeholder-quadro.svg); background-size:cover; background-position:center }
  .hero::after { content:''; position:absolute; inset:0; background:rgba(6,26,51,0.35) }
  .hero-bar { position:absolute; top:0; left:0; right:0; height:4px; background:#F4B500; z-index:2 }
  .hero-txt { position:absolute; inset:auto 0 0 0; padding:22px; z-index:2; color:#fff }
  .eye { font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#F4B500;margin-bottom:6px }
  .ttl { font-family:'Inter',sans-serif;font-weight:800;font-size:28px;letter-spacing:-0.02em;line-height:1.1 }
</style></head>
<body>
<div class="card">
  <div class="hero">
    <div class="hero-bar"></div>
    <div class="hero-txt">
      <div class="eye">QUADRI DI DISTRIBUZIONE BT</div>
      <div class="ttl">Fino a 4.000 A. Forma 4b. Collaudato.</div>
    </div>
  </div>
</div>
</body></html>
