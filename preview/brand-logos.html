<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .logos { display:grid; grid-template-columns: 1fr 1fr; gap:12px }
  .cell { border:1px solid var(--border-subtle); border-radius:4px; padding:18px; display:flex; align-items:center; justify-content:center; min-height:90px }
  .cell.dark { background:#0B2545 }
  .cell img { max-height:48px; width:auto; max-width:100% }
  .lbl { font-family:var(--font-mono); font-size:11px; color:var(--fg-muted); margin-top:6px; text-align:center }
</style></head>
<body>
<div class="card">
  <div class="logos">
    <div>
      <div class="cell"><img src="../assets/logo-lostar.svg" alt=""></div>
      <div class="lbl">primary</div>
    </div>
    <div>
      <div class="cell dark"><img src="../assets/logo-lostar-reverse.svg" alt=""></div>
      <div class="lbl">reverse · on dark</div>
    </div>
    <div>
      <div class="cell"><img src="../assets/logo-lostar-mark.svg" alt="" style="max-height:56px"></div>
      <div class="lbl">mark · favicon / avatar</div>
    </div>
    <div>
      <div class="cell"><img src="../assets/logo-lostar-tagline.svg" alt="" style="max-height:56px"></div>
      <div class="lbl">with tagline · PDFs</div>
    </div>
  </div>
</div>
</body></html>
