<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .btn { display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 18px; border-radius:4px; font-family:var(--font-sans); font-weight:600; font-size:14px; letter-spacing:0.01em; cursor:pointer; border:1px solid transparent; transition:all 180ms cubic-bezier(0.2,0,0,1) }
  .btn.primary { background:#0B2545; color:#fff }
  .btn.primary:hover { background:#061A33 }
  .btn.accent { background:#F4B500; color:#0B2545 }
  .btn.accent:hover { background:#FFC82C }
  .btn.secondary { background:#fff; color:#0B2545; border-color:#C6CCD4 }
  .btn.secondary:hover { border-color:#0B2545 }
  .btn.ghost { background:transparent; color:#0B2545 }
  .btn.ghost:hover { background:#F3F6FB }
  .btn.disabled { background:#0B2545; color:#fff; opacity:0.4; cursor:not-allowed }
  .row4 { display:flex; gap:10px; flex-wrap:wrap; align-items:center }
</style></head>
<body>
<div class="card">
  <div class="row4">
    <button class="btn primary">Richiedi preventivo →</button>
    <button class="btn accent">Scarica scheda</button>
    <button class="btn secondary">Parliamone</button>
    <button class="btn ghost">Annulla</button>
    <button class="btn disabled">Invia</button>
  </div>
  <p class="mono muted" style="margin-top:12px">Height 40 · radius 4 · 600/14 · hover darkens ~10% · focus ring 3px rgba(47,106,179,0.35)</p>
</div>
</body></html>
