<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .card2 { background:#fff; border:1px solid #DFE3E8; border-radius:4px; padding:20px; transition:all 180ms cubic-bezier(0.2,0,0,1) }
  .card2:hover { border-color:#C6CCD4; box-shadow:0 1px 2px rgba(11,37,69,0.06), 0 1px 1px rgba(11,37,69,0.04) }
  .card2.feat { border:2px solid #0B2545 }
  .eye { font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#0B2545;margin-bottom:8px }
  .ttl { font-family:'Inter',sans-serif;font-weight:700;font-size:20px;color:#0F1720;margin-bottom:6px }
  .bod { font-size:14px;line-height:1.5;color:#53606F }
  .spec { margin-top:12px; font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:0.04em;color:#53606F;text-transform:uppercase }
  .grid2 { display:grid;grid-template-columns:1fr 1fr;gap:12px }
</style></head>
<body>
<div class="card">
  <div class="grid2">
    <div class="card2">
      <div class="eye">QUADRO BT · QDB</div>
      <div class="ttl">Distribuzione BT</div>
      <div class="bod">Fino a 4.000 A. Forma 4b.</div>
      <div class="spec">IP55 · IEC 61439</div>
    </div>
    <div class="card2 feat">
      <div class="eye">FEATURED · POWER</div>
      <div class="ttl">Quadro di potenza</div>
      <div class="bod">Motor control center modulare.</div>
      <div class="spec">IP54 · FORMA 3B</div>
    </div>
  </div>
</div>
</body></html>
