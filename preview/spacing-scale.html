<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:8px }
  .cell { border:1px solid var(--border-subtle); border-radius:4px; padding:8px; display:flex; flex-direction:column; align-items:center; gap:6px; background:#fff }
  .box { background:#0B2545; border-radius:2px }
  .lbl { font-family:var(--font-mono); font-size:11px; color:var(--fg-muted) }
</style></head>
<body>
<div class="card">
  <div class="grid">
    <div class="cell"><div class="box" style="width:4px;height:4px"></div><div class="lbl">1 · 4px</div></div>
    <div class="cell"><div class="box" style="width:8px;height:8px"></div><div class="lbl">2 · 8px</div></div>
    <div class="cell"><div class="box" style="width:12px;height:12px"></div><div class="lbl">3 · 12px</div></div>
    <div class="cell"><div class="box" style="width:16px;height:16px"></div><div class="lbl">4 · 16px</div></div>
    <div class="cell"><div class="box" style="width:24px;height:24px"></div><div class="lbl">5 · 24px</div></div>
    <div class="cell"><div class="box" style="width:32px;height:32px"></div><div class="lbl">6 · 32px</div></div>
    <div class="cell"><div class="box" style="width:48px;height:48px"></div><div class="lbl">7 · 48px</div></div>
    <div class="cell"><div class="box" style="width:64px;height:64px"></div><div class="lbl">8 · 64px</div></div>
  </div>
</div>
</body></html>
