<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .row3 { display:flex; gap:16px }
  .box { flex:1; background:#fff; border:1px solid var(--border-subtle); border-radius:4px; padding:18px; font-family:var(--font-mono); font-size:11px; color:var(--fg-muted) }
  .s1 { box-shadow: 0 1px 2px rgba(11,37,69,0.06), 0 1px 1px rgba(11,37,69,0.04) }
  .s2 { box-shadow: 0 2px 6px rgba(11,37,69,0.08), 0 1px 2px rgba(11,37,69,0.05) }
  .s3 { box-shadow: 0 8px 24px rgba(11,37,69,0.10), 0 2px 6px rgba(11,37,69,0.06) }
</style></head>
<body>
<div class="card">
  <div class="row3">
    <div class="box s1">shadow-1<br>hover / lift</div>
    <div class="box s2">shadow-2<br>dropdowns</div>
    <div class="box s3">shadow-3<br>modals only</div>
  </div>
  <p class="mono muted" style="margin-top:14px">Tinted with brand blue · rgba(11, 37, 69, …) · never pure black.</p>
</div>
</body></html>
