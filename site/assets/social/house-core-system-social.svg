<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">House Core, la casa che sa risponderti</title>
  <desc id="desc">Anteprima grafica Lostar in blu e giallo: ambienti, impianti e misure disponibili alimentano il modello locale House Core, consultato dall'assistente.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#27415e" stroke-width="1"/></pattern>
  </defs>
