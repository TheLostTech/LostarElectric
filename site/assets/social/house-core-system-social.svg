  <rect x="594" width="606" height="630" fill="url(#grid)"/>
  <path d="M0 16H1200M0 614H1200" stroke="#294661"/>
  <path d="M68 92h78" stroke="#f4b500" stroke-width="8"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="68" y="143" fill="#f4b500" font-size="19" font-weight="700" letter-spacing="3">HOUSE CORE · LOSTAR</text>
    <text x="68" y="245" fill="#fff" font-size="71" font-weight="800" letter-spacing="-2">La casa che sa</text>
    <text x="68" y="326" fill="#fff" font-size="71" font-weight="800" letter-spacing="-2">risponderti.</text>
    <text x="68" y="398" fill="#d9e4ed" font-size="25">Il sistema operativo locale della casa.</text>
    <text x="68" y="554" fill="#d9e4ed" font-size="17">Un modello vivo. Un assistente con un contesto.</text>
  </g>
  <g stroke="#f4b500" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
