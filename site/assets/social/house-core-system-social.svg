    <rect x="649" y="294" width="142" height="70" rx="4" fill="#fff"/><text x="720" y="337" fill="#0b2545" font-size="18">Impianti</text>
    <rect x="1054" y="143" width="124" height="70" rx="4" fill="#fff"/><text x="1116" y="186" fill="#0b2545" font-size="18">Dispositivi</text>
