<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="styles.css">
<title>Lostar</title>
<div id="root"></div>
<script type="text/babel" src="Icons.jsx"></script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="Pages.jsx"></script>
<script type="text/babel">
function App() {
  const [page, setPage] = React.useState(() => localStorage.getItem('lostar-page') || 'home');
  const [lang, setLang] = React.useState(() => localStorage.getItem('lostar-lang') || 'it');
  React.useEffect(() => { localStorage.setItem('lostar-page', page); window.scrollTo({top:0}); }, [page]);
  React.useEffect(() => { localStorage.setItem('lostar-lang', lang); }, [lang]);
  const Page = { home:HomePage, servizi:ServicesPage, chi:AboutPage, contatti:ContactPage }[page] || HomePage;
  return (
    <div data-screen-label={'Marketing · ' + page}>
      <Header page={page} setPage={setPage} lang={lang} setLang={setLang} />
      <main><Page lang={lang} setPage={setPage} /></main>
      <Footer lang={lang} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
